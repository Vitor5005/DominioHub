server {
    listen 80;
    listen [::]:80;
    server_name 3.17.25.68;

    # Necessário para emissão e renovação do certificado Let's Encrypt.
    # Esta rota continua acessível por HTTP e não deve ser redirecionada.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o restante do tráfego HTTP vai para HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3.17.25.68;

    ssl_certificate /etc/letsencrypt/live/3.17.25.68/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.17.25.68/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|mjs|map|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
