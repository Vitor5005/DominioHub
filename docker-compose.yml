x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "3000"
  FRONTEND_URL: ${FRONTEND_URL}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  TRUST_PROXY: ${TRUST_PROXY}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  DOMAIN_PROVIDER: ${DOMAIN_PROVIDER}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
  AI_PROVIDER: ${AI_PROVIDER}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL}
  AI_HISTORY_LIMIT: ${AI_HISTORY_LIMIT}
  AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS}
  DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED}

x-backend-image: &backend-image
  image: dominiohub-backend:local
  build:
    context: ./backend
    target: production

services:
  postgres:
    image: postgres:17-alpine
    attach: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    attach: false
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-migrate:
    image: dominiohub-backend-migrate:local
    attach: false
    build:
      context: ./backend
      target: migrate
    command:
      - /bin/sh
      - -c
      - >-
        echo '[MIGRATIONS] Aplicando migrations...' &&
        npx prisma migrate deploy --config prisma7.config.ts &&
        echo '[MIGRATIONS] Migrations aplicadas com sucesso.'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-seed:
    image: dominiohub-backend-migrate:local
    attach: false
    build:
      context: ./backend
      target: migrate
    command:
      - /bin/sh
      - -c
      - >-
        if [ "$$DEMO_SEED_ENABLED" != "true" ]; then exit 0; fi;
        npm run db:seed
    environment: *backend-environment
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: "no"

  backend-api:
    <<: *backend-image
    command: ["npm", "start"]
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  event-worker:
    <<: *backend-image
    attach: false
    command: ["npm", "run", "worker:events:start"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  webhook-worker:
    <<: *backend-image
    attach: false
    command: ["npm", "run", "worker:webhooks:start"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: dominiohub-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        echo "[FRONTEND] DomínioHub Web disponível em $$FRONTEND_URL";
        exec nginx -g 'daemon off;'
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
